# Deploys well-known-showcase to Deno Deploy on every push to main.
#
# The org access token (DENO_DEPLOY_TOKEN repo secret, org paulkinlan-ea) has
# no linked GitHub identity, so the OIDC-only denoland/deployctl@v1 action
# cannot authenticate here (it requires the repo to be connected to Deno Deploy
# via the GitHub integration in the console). Instead we run the `deno deploy`
# CLI directly in CI with the token from the secret — same command verified
# manually on 2026-08-05 (production revision 9t6k7t17p858).
#
# If Paul attaches the repo in the Deploy console later, keep exactly ONE
# deploy mechanism — two mechanisms on one app shadow each other (last deploy
# wins).

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2

      - name: Deploy to Deno Deploy
        run: deno deploy --json --non-interactive --org=paulkinlan-ea --app=well-known-showcase --prod .
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
